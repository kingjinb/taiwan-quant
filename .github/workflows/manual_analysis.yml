name: Manual Analysis

on:
  workflow_dispatch:
    inputs:
      stock_list:
        description: "Stock IDs (comma-separated, e.g. 2330,2317,2454)"
        required: false
        default: ""
      days:
        description: "Analysis window (days)"
        required: false
        default: "365"

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run analysis
        run: python scripts/runner.py
        env:
          PYTHONPATH: .

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: quant-reports
          path: reports/
