name: Auto Optimize

on:
  schedule:
    # 1st of each month at 06:00 UTC
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run optimizer
        run: python scripts/optimizer.py
        env:
          PYTHONPATH: .

      - name: Commit optimal params
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/params.json
          git diff --staged --quiet || git commit -m "chore: auto-optimize params $(date +%Y-%m)"
          git push
